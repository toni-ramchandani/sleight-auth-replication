name: Offline experiment checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests (no benchmark data or credentials)
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q run_case.py summarize.py tests
